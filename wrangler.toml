name = "rainha-de-copas-admin"
main = "worker/index.js"
compatibility_date = "2024-01-01"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "rainha-de-copas-db"
database_id = "31adbb6a-78f2-4054-8df5-fedd205172e4"

# Environment variables (secrets should be set via wrangler secret)
[vars]
ENVIRONMENT = "production"

# Development environment
[env.development]
name = "rainha-de-copas-admin-dev"

[[env.development.d1_databases]]
binding = "DB"
database_name = "rainha-de-copas-db-dev"
database_id = "YOUR_DEV_DATABASE_ID"