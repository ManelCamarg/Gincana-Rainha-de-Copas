<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Rainha de Copas 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="bg-[#0D0D0D] text-white font-sans antialiased">
    <!-- Login Section -->
    <div id="login-section" class="min-h-screen flex items-center justify-center">
        <div class="glass-strong border border-[#DC143C]/30 rounded-2xl p-8 max-w-md w-full mx-4">
            <div class="text-center mb-8">
                <div class="text-6xl mb-4">👑</div>
                <h1 class="font-['Cinzel'] text-3xl font-bold text-[#DC143C] mb-2">Admin Panel</h1>
                <p class="text-gray-400">Rainha de Copas 2026</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                    <input type="email" id="email" class="w-full px-4 py-3 bg-[#1A1A1A] border border-[#DC143C]/30 rounded-lg text-white focus:outline-none focus:border-[#DC143C]" placeholder="seu@email.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Senha</label>
                    <input type="password" id="password" class="w-full px-4 py-3 bg-[#1A1A1A] border border-[#DC143C]/30 rounded-lg text-white focus:outline-none focus:border-[#DC143C]" placeholder="••••••••••">
                </div>
                <button id="login-btn" class="w-full btn-premium text-white font-semibold rounded-lg py-3">
                    Entrar
                </button>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-dashboard" class="hidden">
        <!-- Navigation -->
        <nav class="fixed top-0 left-0 right-0 z-50 glass-strong border-b border-[#DC143C]/20">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center space-x-2">
                        <span class="text-2xl">👑</span>
                        <span class="font-['Cinzel'] font-bold text-[#DC143C] text-lg">Admin Panel</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span id="user-info" class="text-gray-300 text-sm"></span>
                        <button id="logout-btn" class="px-4 py-2 bg-[#DC143C] hover:bg-[#8B0000] rounded-lg text-sm font-medium transition-colors">
                            Sair
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="pt-20 pb-12">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <!-- Tabs -->
                <div class="flex space-x-2 mb-8 border-b border-[#DC143C]/20 pb-4">
                    <button class="tab-btn active px-4 py-2 rounded-lg font-medium transition-colors" data-tab="tasks">Tarefas</button>
                    <button class="tab-btn px-4 py-2 rounded-lg font-medium transition-colors" data-tab="schedule">Cronograma</button>
                    <button class="tab-btn px-4 py-2 rounded-lg font-medium transition-colors" data-tab="team">Equipe</button>
                    <button class="tab-btn px-4 py-2 rounded-lg font-medium transition-colors" data-tab="lore">História</button>
                    <button class="tab-btn px-4 py-2 rounded-lg font-medium transition-colors" data-tab="announcements">Anúncios</button>
                </div>

                <!-- Tasks Tab -->
                <div id="tasks-tab" class="tab-content">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="font-['Cinzel'] text-2xl font-bold text-white">Gerenciar Tarefas</h2>
                        <button id="add-task-btn" class="btn-premium px-4 py-2 rounded-lg font-medium">
                            + Nova Tarefa
                        </button>
                    </div>
                    <div id="tasks-list" class="space-y-4">
                        <p class="text-gray-400 text-center py-8">Carregando tarefas...</p>
                    </div>
                </div>

                <!-- Schedule Tab -->
                <div id="schedule-tab" class="tab-content hidden">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="font-['Cinzel'] text-2xl font-bold text-white">Gerenciar Cronograma</h2>
                        <button id="add-event-btn" class="btn-premium px-4 py-2 rounded-lg font-medium">
                            + Novo Evento
                        </button>
                    </div>
                    <div id="schedule-list" class="space-y-4">
                        <p class="text-gray-400 text-center py-8">Carregando cronograma...</p>
                    </div>
                </div>

                <!-- Team Tab -->
                <div id="team-tab" class="tab-content hidden">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="font-['Cinzel'] text-2xl font-bold text-white">Gerenciar Equipe</h2>
                        <button id="add-member-btn" class="btn-premium px-4 py-2 rounded-lg font-medium">
                            + Novo Membro
                        </button>
                    </div>
                    <div id="team-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <p class="text-gray-400 text-center py-8 col-span-4">Carregando equipe...</p>
                    </div>
                </div>

                <!-- Lore Tab -->
                <div id="lore-tab" class="tab-content hidden">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="font-['Cinzel'] text-2xl font-bold text-white">Gerenciar História</h2>
                        <button id="add-chapter-btn" class="btn-premium px-4 py-2 rounded-lg font-medium">
                            + Novo Capítulo
                        </button>
                    </div>
                    <div id="lore-list" class="space-y-4">
                        <p class="text-gray-400 text-center py-8">Carregando história...</p>
                    </div>
                </div>

                <!-- Announcements Tab -->
                <div id="announcements-tab" class="tab-content hidden">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="font-['Cinzel'] text-2xl font-bold text-white">Gerenciar Anúncios</h2>
                        <button id="add-announcement-btn" class="btn-premium px-4 py-2 rounded-lg font-medium">
                            + Novo Anúncio
                        </button>
                    </div>
                    <div id="announcements-list" class="space-y-4">
                        <p class="text-gray-400 text-center py-8">Carregando anúncios...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-sm">
        <div class="glass-strong border-2 border-[#DC143C] rounded-2xl p-8 max-w-2xl mx-4 w-full max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modal-title" class="font-['Cinzel'] text-2xl font-bold text-[#DC143C]">Editar</h3>
                <button id="close-modal" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            <form id="edit-form" class="space-y-4">
                <!-- Form fields will be dynamically generated -->
            </form>
            <div class="flex justify-end space-x-4 mt-6">
                <button id="cancel-btn" class="px-6 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg font-medium transition-colors">
                    Cancelar
                </button>
                <button id="save-btn" class="btn-premium px-6 py-2 rounded-lg font-medium">
                    Salvar Alterações
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 right-4 z-50 hidden">
        <div class="glass-strong border border-[#DC143C]/30 rounded-lg p-4 flex items-center space-x-3">
            <span id="toast-icon" class="text-2xl"></span>
            <div>
                <p id="toast-title" class="font-semibold text-white"></p>
                <p id="toast-message" class="text-sm text-gray-300"></p>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
